name: CI/CD SRE Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff mypy

      - name: Run Formatting Check (Black)
        run: black --check backend

      - name: Run Import Sorting Check (isort)
        run: isort --check-only backend

      - name: Run Linting Checks (Ruff)
        run: ruff check backend

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install DevSecOps Scanning Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Static Security Scan (Bandit)
        run: bandit -r backend/app -x backend/tests

      - name: Dependency Audit (pip-audit)
        run: pip-audit -r backend/requirements.txt --allow-cyclical || echo "Dependency warnings logged."

      - name: Safety Scan
        run: safety check -r backend/requirements.txt || echo "Safety vulnerabilities logged."

  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Integration & Unit Tests
        env:
          ENVIRONMENT: testing
          MONGODB_URL: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          SECRET_KEY: testingsecretkey2026!
        run: |
          cd backend
          pytest

  build-and-push-images:
    needs: [lint-and-format, security-scans, backend-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend API Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/guardianmail-api:latest
            ghcr.io/${{ github.repository }}/guardianmail-api:${{ github.sha }}

      - name: Build and Push Frontend Web Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/guardianmail-frontend:latest
            ghcr.io/${{ github.repository }}/guardianmail-frontend:${{ github.sha }}
