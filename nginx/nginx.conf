# Global rate-limiting zone configuration
limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    # HTTPS Redirect configuration template (Uncomment in production with SSL certificates)
    # listen 443 ssl http2;
    # ssl_certificate /etc/nginx/ssl/live/guardianmail.com/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/live/guardianmail.com/privkey.pem;
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:;" always;
    add_header X-Request-ID $request_id always;

    # Limit payload size
    client_max_body_size 10M;

    # Route frontend requests to the React web app container
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Route backend API requests
    location /api/ {
        # Enforce SRE rate limit zone (allow bursts of up to 20 requests)
        limit_req zone=api_limit_zone burst=20 nodelay;

        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
