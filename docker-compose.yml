version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: guardianmail_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - guardianmail_net

  redis:
    image: redis:7.2-alpine
    container_name: guardianmail_redis
    restart: unless-stopped
    networks:
      - guardianmail_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardianmail_api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=enterprise-super-secure-key-2026-production-ready!
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    depends_on:
      - mongo
      - redis
    networks:
      - guardianmail_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardianmail_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=enterprise-super-secure-key-2026-production-ready!
    depends_on:
      - redis
      - mongo
    networks:
      - guardianmail_net

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardianmail_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=enterprise-super-secure-key-2026-production-ready!
    depends_on:
      - redis
      - mongo
    networks:
      - guardianmail_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: guardianmail_frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - guardianmail_net

  nginx:
    image: nginx:1.25-alpine
    container_name: guardianmail_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - guardianmail_net

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: guardianmail_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - guardianmail_net

  grafana:
    image: grafana/grafana:10.0.0
    container_name: guardianmail_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - guardianmail_net

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  guardianmail_net:
    driver: bridge

